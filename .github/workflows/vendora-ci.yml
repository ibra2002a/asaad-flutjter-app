name: VENDORA CI

on:
  push:
    paths:
      - 'vendora/**'
      - '.github/workflows/vendora-ci.yml'
  pull_request:
    paths:
      - 'vendora/**'

permissions:
  contents: read

jobs:
  web:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendora
    env:
      # Placeholders only: the build needs well-formed public values, never real credentials.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build-only-000000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendora/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and RLS tests (local PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: vendora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendora/package-lock.json
      - run: npm ci
      - name: Create disposable test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c "create database vendora_test"
      - name: Run migrations and security tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vendora_test
          VENDORA_DB_TEST_CONFIRM: 'yes'
        run: npm run test:db
